network_dim = 32
network_alpha = 32
learning_rate = 2e-5
max_train_epochs = 4
save_every_n_epochs = 2
checkpointing_epochs = 2
use_shuffled_caption_variants = true
cache_llm_adapter_outputs = true
caption_dropout_rate = 0.1
output_name = "anima_lokr"
blocks_to_swap = 0
use_cmmd = false

# LoKr: Kronecker-product delta (w1 full x w2 full-or-lowrank). More
# expressive per parameter than a rank-r LoRA; w2 falls back to a full
# matrix (scale=1) when the rank is large relative to the layer dims.
# lokr_factor: -1 = balanced split (LyCORIS default); a positive divisor
# pins the w1 axis. Checkpoint loads in-repo only (not the ComfyUI stock
# LoRA path).
use_lokr = true
lokr_factor = -1

# 可选叠加开关（对应其它训练器的 Lora Dora / Lora Rs 勾选框）：
# use_dora=true → DoKr（LoKr 方向 + 逐通道幅度，LyCORIS dokr 语义）；
# rs_lora=true  → 有效缩放 alpha/sqrt(r)。两个可以同时开。
use_dora = false
rs_lora = false

[variant]
family = "lora"
label = "LoKr"
description = "LoRA + Kronecker product — more expressive per parameter; loads in-repo only."
order = 40
target_res = [ 896, 1024,]
