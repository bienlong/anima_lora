network_dim = 32
network_alpha = 32
learning_rate = 2e-5
max_train_epochs = 4
save_every_n_epochs = 2
checkpointing_epochs = 2
use_shuffled_caption_variants = true
cache_llm_adapter_outputs = true
caption_dropout_rate = 0.1
output_name = "anima_dora"
blocks_to_swap = 0
use_cmmd = false

# DoRA: weight-decomposed LoRA — trainable per-channel magnitude
# (.dora_scale) over the standard direction. Converges more stably than
# plain LoRA; slightly more VRAM. Saves as a ComfyUI-loadable DoRA file.
use_dora = true
rs_lora = false
# 范数不进梯度图：速度与普通 LoRA 持平（实测 1.51 vs 1.48 秒/步）、显存
# 从 15.9GB 降到 1GB。代价是范数对低秩方向的二阶梯度为零（社区常见近似）。
# 改回 false = 标准 DoRA 语义，但速度慢一个量级。
dora_detach_norm = true

[variant]
family = "lora"
label = "DoRA"
description = "Weight-decomposed LoRA (direction + magnitude) — steadier convergence, slightly more VRAM."
order = 20
target_res = [ 896, 1024,]
